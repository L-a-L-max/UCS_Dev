# Redis Sentinel 1 配置
# 监控 Redis Cluster 的3个 Master 节点
port 26379

# 监控 Master 节点 (name, host, port, quorum)
# quorum=2: 至少2个Sentinel同意Master下线才触发故障转移
sentinel monitor redis-master-1 redis-node-1 6371 2
sentinel monitor redis-master-2 redis-node-2 6372 2
sentinel monitor redis-master-3 redis-node-3 6373 2

# Master 多久无响应被判定为主观下线 (SDOWN)
sentinel down-after-milliseconds redis-master-1 5000
sentinel down-after-milliseconds redis-master-2 5000
sentinel down-after-milliseconds redis-master-3 5000

# 故障转移超时时间
sentinel failover-timeout redis-master-1 10000
sentinel failover-timeout redis-master-2 10000
sentinel failover-timeout redis-master-3 10000

# 故障转移时同时同步新Master的Slave数量
sentinel parallel-syncs redis-master-1 1
sentinel parallel-syncs redis-master-2 1
sentinel parallel-syncs redis-master-3 1

# 日志级别
loglevel notice

# 持久化Sentinel状态
dir /data
