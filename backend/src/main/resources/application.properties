# Server Configuration
server.port=8080

# ============================================================
# Database Configuration - PostgreSQL (default)
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ucsdb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:ucs_user}
spring.datasource.password=${DB_PASSWORD:ucs_password}

# ============================================================
# T-31: HikariCP 连接池调优 (3实例×20连接=60总连接)
# ============================================================
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.pool-name=UCS-HikariPool

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (disabled by default, enable with spring.profiles.active=h2dev)
spring.h2.console.enabled=false

# ============================================================
# JWT Configuration - 双 Token 三验证
# ============================================================
jwt.secret=${JWT_SECRET:change-me-in-production}
# Access Token 有效期: 30分钟 (1800000ms)
jwt.access-token.expiration=1800000
# Refresh Token 有效期: 7天 (604800000ms)
jwt.refresh-token.expiration=604800000

# ============================================================
# T-36: Redis Cluster Configuration (单节点→6节点集群)
# ============================================================
# 单节点模式（开发环境，注释掉 cluster 配置即可回退）
# spring.data.redis.host=localhost
# spring.data.redis.port=6379
# Cluster模式（生产环境，3 Master + 3 Slave）
spring.data.redis.cluster.nodes=${REDIS_CLUSTER_NODES:redis-node-1:6371,redis-node-2:6372,redis-node-3:6373,redis-node-4:6374,redis-node-5:6375,redis-node-6:6376}
spring.data.redis.cluster.max-redirects=3
spring.data.redis.timeout=3000
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.min-idle=5
spring.data.redis.lettuce.pool.max-wait=3000ms

# DDS Configuration
# Set dds.simulator.enabled=true to use built-in simulator (no real PX4 needed)
# Set dds.simulator.enabled=false when using real DDS gateway (dds-gateway Python script)
dds.simulator.enabled=false
dds.simulator.interval-ms=2000
dds.simulator.drone-count=4

# DDS Gateway API key (used by Python DDS gateway to authenticate)
dds.gateway.api-key=${DDS_GATEWAY_API_KEY:ucs-dds-gateway-secret-2024}

# DDS Gateway command server URL (Python gateway HTTP endpoint for publishing commands)
dds.gateway.command-url=${DDS_GATEWAY_COMMAND_URL:http://localhost:5050}

# Logging
logging.level.com.ucs=INFO
logging.level.org.springframework.security=WARN

# OpenAPI/Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# WebSocket
spring.websocket.message-size-limit=65536

# T-21: 调度线程池扩容 (5 → 15)
spring.task.scheduling.pool.size=15

# T-22: Java虚拟线程 (Spring Boot 3.2+, JDK 21)
spring.threads.virtual.enabled=true

# ============================================================
# Kafka Configuration (T-08: 3-Broker KRaft 集群)
# ============================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.consumer.group-id=ucs-backend
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# T-11: 关闭自动提交，由 KafkaConfig 中的 MANUAL_IMMEDIATE 控制
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# T-10: 指令生产者 acks=all + 幂等
spring.kafka.producer.acks=all
spring.kafka.producer.retries=5
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=1

# Kafka topic names
kafka.topic.telemetry-raw=telemetry.raw
kafka.topic.events-drone=events.drone
kafka.topic.commands-down=commands.down
kafka.topic.commands-mavlink-down=commands.mavlink.down
kafka.topic.commands-ack=commands.ack
kafka.topic.member-status=member.status

# Kafka feature toggle (set to false to disable Kafka consumers when Kafka is unavailable)
kafka.enabled=${KAFKA_ENABLED:true}

# ============================================================
# T-43: Spring Boot Actuator + Micrometer Prometheus
# ============================================================
management.endpoints.web.exposure.include=health,prometheus,metrics,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true

# ============================================================
# T-51: 分布式追踪 (OpenTelemetry + Jaeger)
# ============================================================
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:0.1}
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}

# ============================================================
# T-49: Resilience4j 熔断+重试+舱壁
# ============================================================
# Redis 熔断器
resilience4j.circuitbreaker.instances.redis.sliding-window-size=10
resilience4j.circuitbreaker.instances.redis.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.redis.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.redis.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.redis.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.instances.redis.slow-call-rate-threshold=80
# 网关HTTP 熔断器
resilience4j.circuitbreaker.instances.gateway-http.sliding-window-size=5
resilience4j.circuitbreaker.instances.gateway-http.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.gateway-http.wait-duration-in-open-state=10s
# 网关HTTP 重试
resilience4j.retry.instances.gateway-http.max-attempts=3
resilience4j.retry.instances.gateway-http.wait-duration=500ms
resilience4j.retry.instances.gateway-http.exponential-backoff-multiplier=2
# 舱壁隔离
resilience4j.bulkhead.instances.telemetry-persist.max-concurrent-calls=30
resilience4j.bulkhead.instances.command-dispatch.max-concurrent-calls=10

# ============================================================
# T-47: API限流 (基于 Spring MVC 拦截器)
# ============================================================
ucs.rate-limit.default-qps=100
ucs.rate-limit.command-qps=10

# ============================================================
# T-53: Nacos 配置中心 (可选，启用需设置环境变量)
# ============================================================
spring.cloud.nacos.config.enabled=${NACOS_ENABLED:false}
spring.cloud.nacos.config.server-addr=${NACOS_SERVER_ADDR:localhost:8848}
spring.cloud.nacos.config.namespace=${NACOS_NAMESPACE:ucs}
spring.cloud.nacos.config.file-extension=properties

# ============================================================
# T-56: Kafka/Redis TLS 加密 (生产环境启用)
# ============================================================
# Kafka TLS (取消注释以启用)
# spring.kafka.properties.security.protocol=SSL
# spring.kafka.ssl.trust-store-location=classpath:kafka-truststore.jks
