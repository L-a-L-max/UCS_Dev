# Server Configuration
server.port=8080

# ============================================================
# Database Configuration - PostgreSQL (default)
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ucsdb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:ucs_user}
spring.datasource.password=${DB_PASSWORD:ucs_password}

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (disabled by default, enable with spring.profiles.active=h2dev)
spring.h2.console.enabled=false

# ============================================================
# JWT Configuration - 双 Token 三验证
# ============================================================
jwt.secret=${JWT_SECRET:change-me-in-production}
# Access Token 有效期: 30分钟 (1800000ms)
jwt.access-token.expiration=1800000
# Refresh Token 有效期: 7天 (604800000ms)
jwt.refresh-token.expiration=604800000

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=3000
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# DDS Configuration
# Set dds.simulator.enabled=true to use built-in simulator (no real PX4 needed)
# Set dds.simulator.enabled=false when using real DDS gateway (dds-gateway Python script)
dds.simulator.enabled=false
dds.simulator.interval-ms=2000
dds.simulator.drone-count=4

# DDS Gateway API key (used by Python DDS gateway to authenticate)
dds.gateway.api-key=${DDS_GATEWAY_API_KEY:ucs-dds-gateway-secret-2024}

# DDS Gateway command server URL (Python gateway HTTP endpoint for publishing commands)
dds.gateway.command-url=${DDS_GATEWAY_COMMAND_URL:http://localhost:5050}

# Logging
logging.level.com.ucs=INFO
logging.level.org.springframework.security=WARN

# OpenAPI/Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# WebSocket
spring.websocket.message-size-limit=65536

# Scheduling (for heartbeat checks)
spring.task.scheduling.pool.size=5

# ============================================================
# Kafka Configuration
# ============================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=ucs-backend
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=1
spring.kafka.producer.retries=3

# Kafka topic names
kafka.topic.telemetry-raw=telemetry.raw
kafka.topic.events-drone=events.drone
kafka.topic.commands-down=commands.down
kafka.topic.commands-ack=commands.ack
kafka.topic.member-status=member.status

# Kafka feature toggle (set to false to disable Kafka consumers when Kafka is unavailable)
kafka.enabled=${KAFKA_ENABLED:true}
