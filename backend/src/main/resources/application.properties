# Server Configuration
server.port=8080

# ============================================================
# Database Configuration - PostgreSQL (default)
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ucsdb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:ucs_user}
spring.datasource.password=${DB_PASSWORD:ucs_password}

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (disabled by default, enable with spring.profiles.active=h2dev)
spring.h2.console.enabled=false

# JWT Configuration
jwt.secret=ucs-platform-secret-key-for-jwt-token-generation-2024-secure-enough-for-hs512
jwt.expiration=86400000

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=3000
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# DDS Configuration
# Set dds.simulator.enabled=true to use built-in simulator (no real PX4 needed)
# Set dds.simulator.enabled=false when using real DDS gateway (dds-gateway Python script)
dds.simulator.enabled=false
dds.simulator.interval-ms=2000
dds.simulator.drone-count=4

# DDS Gateway API key (used by Python DDS gateway to authenticate)
dds.gateway.api-key=${DDS_GATEWAY_API_KEY:ucs-dds-gateway-secret-2024}

# DDS Gateway command server URL (Python gateway HTTP endpoint for publishing commands)
dds.gateway.command-url=${DDS_GATEWAY_COMMAND_URL:http://localhost:5050}

# Logging
logging.level.com.ucs=INFO
logging.level.org.springframework.security=WARN

# OpenAPI/Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# WebSocket
spring.websocket.message-size-limit=65536

# Scheduling (for heartbeat checks)
spring.task.scheduling.pool.size=5
