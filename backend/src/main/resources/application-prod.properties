# ============================================================
# Production Configuration for PostgreSQL + Redis
# ============================================================
# Copy this file and modify passwords before deploying.
# Activate with: --spring.profiles.active=prod
# Or set env: SPRING_PROFILES_ACTIVE=prod

# Server Configuration
server.port=8080

# ============================================================
# PostgreSQL Database Configuration
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ucsdb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=ucs_user
spring.datasource.password=${DB_PASSWORD:your_secure_password}

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ============================================================
# Redis Configuration
# ============================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=5000
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=3000

# ============================================================
# JWT Configuration
# ============================================================
jwt.secret=${JWT_SECRET:ucs-platform-secret-key-for-jwt-token-generation-2024-secure-enough-for-hs512}
jwt.expiration=86400000

# ============================================================
# Zenoh Configuration
# ============================================================
zenoh.router.endpoint=${ZENOH_ENDPOINT:tcp/localhost:7447}
zenoh.enabled=${ZENOH_ENABLED:true}

# ============================================================
# Logging
# ============================================================
logging.level.root=INFO
logging.level.com.ucs=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN

# Disable H2 Console in production
spring.h2.console.enabled=false

# ============================================================
# WebSocket & Scheduling
# ============================================================
spring.websocket.message-size-limit=65536
spring.task.scheduling.pool.size=5
