# ============================================================
# T-53: Nacos 配置中心引导文件
#
# 此文件在 Spring Boot 启动最早阶段加载（优先于 application.properties），
# 用于告诉应用从 Nacos 拉取远程配置。
#
# 启用条件：设置环境变量 NACOS_ENABLED=true
# 未启用时：应用使用本地 application.properties，此文件不生效
# ============================================================
spring:
  application:
    name: ucs-backend
  cloud:
    nacos:
      config:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:ucs}
        file-extension: properties
        # 共享配置（多微服务共用的配置）
        shared-configs:
          - data-id: common-redis.properties
            group: DEFAULT_GROUP
            refresh: true
          - data-id: common-kafka.properties
            group: DEFAULT_GROUP
            refresh: true
        # 动态刷新（修改 Nacos 配置后自动生效，无需重启）
        refresh-enabled: true
