# ============================================================
# H2 Development Profile
# Activate with: --spring.profiles.active=h2dev
# Uses H2 in-memory database for quick local testing without PostgreSQL
# ============================================================

# Database Configuration - H2 in-memory
spring.datasource.url=jdbc:h2:mem:ucsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Enable DDS simulator (no real PX4 needed)
dds.simulator.enabled=true
