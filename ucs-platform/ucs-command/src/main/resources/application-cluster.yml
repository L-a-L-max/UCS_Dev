# ============================================================
# Redis Cluster + Sentinel 配置 (生产/多实例环境)
#
# 激活方式: spring.profiles.active=cluster
#   或环境变量: SPRING_PROFILES_ACTIVE=cluster
#
# 此Profile覆盖默认的单节点Redis配置，切换为:
#   - Redis Cluster (3M+3S) 用于数据分片和高可用
#   - Sentinel 监控用于自动故障转移通知
# ============================================================
spring:
  data:
    redis:
      cluster:
        nodes:
          - ${REDIS_NODE_1:redis-node-1:6371}
          - ${REDIS_NODE_2:redis-node-2:6372}
          - ${REDIS_NODE_3:redis-node-3:6373}
          - ${REDIS_NODE_4:redis-node-4:6374}
          - ${REDIS_NODE_5:redis-node-5:6375}
          - ${REDIS_NODE_6:redis-node-6:6376}
        max-redirects: 3
      sentinel:
        master: ${REDIS_SENTINEL_MASTER:redis-master-1}
        nodes:
          - ${REDIS_SENTINEL_1:redis-sentinel-1:26379}
          - ${REDIS_SENTINEL_2:redis-sentinel-2:26380}
          - ${REDIS_SENTINEL_3:redis-sentinel-3:26381}
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
        cluster:
          refresh:
            adaptive: true
            period: 30s
