server:
  port: 8086

spring:
  application:
    name: ucs-business
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ucs}
    username: ${DB_USER:ucs}
    password: ${DB_PASS:ucs_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ucs-business
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        session.timeout.ms: 45000
        heartbeat.interval.ms: 15000
        max.poll.interval.ms: 600000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: 1
      retries: 3
    listener:
      missing-topics-fatal: false

kafka:
  enabled: ${KAFKA_ENABLED:true}
  topic:
    telemetry-raw: telemetry.raw
    telemetry-processed: telemetry.processed
    events-drone: events.drone
    commands-down: commands.down
    commands-ack: commands.ack

dds:
  gateway:
    command-url: ${DDS_GATEWAY_COMMAND_URL:http://localhost:5050}

jwt:
  secret: ${JWT_SECRET:change-me-in-production}
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

logging:
  level:
    com.ucs.business: INFO
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
    org.apache.kafka.clients.consumer: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
