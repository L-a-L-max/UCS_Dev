# ============================================================
# T-12 + T-42: Prometheus 配置 — 全链路监控
# 覆盖: Spring Boot Actuator, Kafka, Redis, Node, Prometheus
# ============================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警规则文件
rule_files:
  - "alert-rules.yml"

# 告警通知
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# 数据采集目标
scrape_configs:
  # ---- 微服务 Actuator 指标 (各服务多实例) ----
  - job_name: 'ucs-api-gateway'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['ucs-api-gateway-1:8080']
        labels:
          service: 'ucs-api-gateway'

  - job_name: 'ucs-business'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['ucs-business-1:8086', 'ucs-business-2:8086']
        labels:
          service: 'ucs-business'

  - job_name: 'ucs-telemetry-ingest'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['ucs-telemetry-ingest-1:8081', 'ucs-telemetry-ingest-2:8081']
        labels:
          service: 'ucs-telemetry-ingest'

  - job_name: 'ucs-telemetry-store'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['ucs-telemetry-store-1:8082', 'ucs-telemetry-store-2:8082']
        labels:
          service: 'ucs-telemetry-store'

  - job_name: 'ucs-realtime-push'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['ucs-realtime-push-1:8083', 'ucs-realtime-push-2:8083']
        labels:
          service: 'ucs-realtime-push'

  - job_name: 'ucs-command'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['ucs-command-1:8084', 'ucs-command-2:8084']
        labels:
          service: 'ucs-command'

  - job_name: 'ucs-drone-state'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['ucs-drone-state-1:8085', 'ucs-drone-state-2:8085']
        labels:
          service: 'ucs-drone-state'

    # K8s环境使用Pod服务发现 (替代上方static_configs):
    # kubernetes_sd_configs:
    #   - role: pod
    #     namespaces: { names: ['ucs'] }
    # relabel_configs:
    #   - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
    #     action: keep
    #     regex: true

  # ---- T-12: Kafka Exporter 指标 ----
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']
        labels:
          cluster: 'ucs-kafka'

  # ---- T-42: Redis Exporter 指标 ----
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          cluster: 'ucs-redis'

  # ---- T-42: Node Exporter（主机级指标） ----
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Prometheus 自身指标
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
