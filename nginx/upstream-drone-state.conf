worker_processes auto;
events { worker_connections 512; }
http {
    upstream backend {
        server ucs-drone-state-1:8085;
        server ucs-drone-state-2:8085;
    }
    server {
        listen 80;
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
