# T-28: Nginx 负载均衡配置 — 后端多实例部署
# 支持 HTTP API + WebSocket 双协议负载均衡

worker_processes auto;
events {
    worker_connections 4096;
}

http {
    # ---- 后端实例上游 ----
    upstream ucs-backend {
        # ip_hash 保证同一客户端IP始终路由到同一实例
        # WebSocket 是长连接，需要会话粘性
        ip_hash;

        server ucs-backend-1:8080;
        server ucs-backend-2:8080;
        server ucs-backend-3:8080;
    }

    # ---- WebSocket 升级映射 ----
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;

        # ---- 健康检查端点 ----
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # ---- WebSocket 端点 ----
        location /ws {
            proxy_pass http://ucs-backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 超时设置
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---- REST API ----
        location / {
            proxy_pass http://ucs-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 请求体大小限制
            client_max_body_size 10m;
        }
    }
}
