##############################################
# T-41: UCS 微服务架构 — 公共 ConfigMap
# 所有微服务共享的环境变量（Kafka/Redis/DB/Tracing）
##############################################
apiVersion: v1
kind: ConfigMap
metadata:
  name: ucs-common-config
  namespace: ucs
data:
  # ── Kafka 3-Broker 集群 ──
  KAFKA_BOOTSTRAP: "kafka-1:29092,kafka-2:29092,kafka-3:29092"

  # ── Redis Cluster ──
  REDIS_HOST: "redis-1"
  REDIS_PORT: "6379"
  REDIS_CLUSTER_NODES: "redis-1:6379,redis-2:6379,redis-3:6379,redis-4:6379,redis-5:6379,redis-6:6379"

  # ── PostgreSQL ──
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "ucsdb"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/ucsdb"

  # ── TimescaleDB ──
  TIMESCALEDB_HOST: "timescaledb-service"
  TIMESCALEDB_PORT: "5432"
  TIMESCALEDB_URL: "jdbc:postgresql://timescaledb-service:5432/ucs_telemetry"

  # ── Nacos 配置中心 ──
  NACOS_SERVER_ADDR: "nacos-service:8848"
  NACOS_NAMESPACE: "ucs-prod"

  # ── OpenTelemetry / Jaeger ──
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger-collector:4317"
  TRACING_SAMPLE_RATE: "0.1"

  # ── Spring Profile ──
  SPRING_PROFILES_ACTIVE: "prod"
