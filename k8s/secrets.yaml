##############################################
# T-41: UCS Secrets (模板 — 部署时替换实际值)
# 使用前执行: kubectl create secret generic ucs-db-secret \
#   --from-literal=username=<DB_USER> --from-literal=password=<DB_PASS> -n ucs
##############################################
apiVersion: v1
kind: Secret
metadata:
  name: ucs-db-secret
  namespace: ucs
type: Opaque
data:
  # Base64编码: echo -n 'ucs_user' | base64
  username: dWNzX3VzZXI=
  password: CHANGEME_BASE64_ENCODED
---
apiVersion: v1
kind: Secret
metadata:
  name: ucs-jwt-secret
  namespace: ucs
type: Opaque
data:
  # Base64编码的JWT密钥
  secret: CHANGEME_BASE64_ENCODED
