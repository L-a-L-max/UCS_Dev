##############################################
# T-41: UCS 微服务架构 — K8s Deployment/Service/HPA
# 7个微服务模块独立部署，支持水平自动扩缩
# ucs-common 为共享库模块，不独立部署
##############################################

# ============================================================
# 1. ucs-api-gateway — API网关（入口）
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ucs-api-gateway
  namespace: ucs
  labels:
    app: ucs-api-gateway
    tier: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ucs-api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ucs-api-gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: ucs-api-gateway
          image: ${DOCKER_REGISTRY}/ucs-api-gateway:${IMAGE_TAG:-latest}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ucs-jwt-secret
                  key: secret
            - name: RATE_LIMIT_DEFAULT_QPS
              value: "100"
            - name: RATE_LIMIT_COMMAND_QPS
              value: "10"
            - name: NACOS_SERVER_ADDR
              value: "nacos-service:8848"
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m -XX:+UseG1GC"
          envFrom:
            - configMapRef:
                name: ucs-common-config
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 20
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ucs-api-gateway-service
  namespace: ucs
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: ucs-api-gateway
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ucs-api-gateway-hpa
  namespace: ucs
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ucs-api-gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

---
